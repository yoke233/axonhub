name: axonhub

services:
  mock-ai-provider:
    image: ${AXONHUB_IMAGE:-registry-vpc.cn-shanghai.aliyuncs.com/xiaoin/axonhub}:${AXONHUB_TAG:-latest}
    container_name: axonhub-mock-ai-provider
    entrypoint:
      - /app/mock-ai-provider
    command:
      - -addr
      - :18090
    ports:
      - "${MOCK_AI_PROVIDER_PUBLISH_PORT:-18090}:18090"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:18090/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - axonhub-network
    restart: unless-stopped

networks:
  axonhub-network:
    driver: bridge
