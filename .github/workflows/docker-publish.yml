# Publish Docker image
# Copy from new-api 
# https://github.com/QuantumNous/new-api/blob/main/.github/workflows/docker-image-arm64.yml

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manual image tag (default: manual-<short-sha>)'
        required: false
        type: string

env:
  DOCKERHUB_IMAGE: yoke233/axonhub
  GHCR_IMAGE: ghcr.io/yoke233/axonhub

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tag & write VERSION
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [[ -z "${TAG}" ]]; then
              TAG="manual-${GITHUB_SHA::7}"
            fi
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "$TAG" > internal/build/VERSION
          echo "Building tag: $TAG for ${{ matrix.arch }}"

      - name: Decide target registries
        id: registries
        shell: bash
        run: |
          images=("${{ env.GHCR_IMAGE }}")
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            images+=("${{ env.DOCKERHUB_IMAGE }}")
            echo "push_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets not found, publish GHCR only."
          fi

          {
            echo 'images<<EOF'
            printf '%s\n' "${images[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.push_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}

      - name: Prepare image tags
        id: image_tags
        shell: bash
        run: |
          tags=()
          while IFS= read -r image; do
            [[ -z "${image}" ]] && continue
            tags+=("${image}:${TAG}-${{ matrix.arch }}")
            tags+=("${image}:latest-${{ matrix.arch }}")
          done <<'EOF'
          ${{ steps.registries.outputs.images }}
          EOF

          {
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push single-arch images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [[ -z "${TAG}" ]]; then
              TAG="manual-${GITHUB_SHA::7}"
            fi
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Decide target registries
        id: registries
        shell: bash
        run: |
          images=("${{ env.GHCR_IMAGE }}")
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            images+=("${{ env.DOCKERHUB_IMAGE }}")
            echo "push_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets not found, publish GHCR only."
          fi

          {
            echo 'images<<EOF'
            printf '%s\n' "${images[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.push_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifests
        shell: bash
        run: |
          while IFS= read -r image; do
            [[ -z "${image}" ]] && continue

            docker buildx imagetools create \
              -t "${image}:${TAG}" \
              "${image}:${TAG}-amd64" \
              "${image}:${TAG}-arm64"

            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:latest-amd64" \
              "${image}:latest-arm64"
          done <<'EOF'
          ${{ steps.registries.outputs.images }}
          EOF
